<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - TodoDeportes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2>Mi perfil</h2>

    <form id="profile-form" class="mt-4">

        <!-- Nombre -->
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" class="form-control" id="profile-nombre">
        </div>

        <!-- Email (solo lectura) -->
        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" id="profile-email" disabled>
        </div>

        <!-- Nueva contraseña -->
        <div class="mb-3">
            <label>Nueva contraseña</label>
            <input type="password" class="form-control" id="profile-password">
            <div class="invalid-feedback" id="profile-password-error"></div>
        </div>

        <button type="submit" class="btn btn-primary">
            Guardar cambios
        </button>

    </form>
</div>

<script src="js/profile.js"></script>
</body>
</html>
