{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Recuperar contraseña</h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <button class="btn btn-primary">
            Enviar enlace
        </button>
    </form>
</div>
{% endblock %}
