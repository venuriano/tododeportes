<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - TodoDeportes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2>Recuperar contraseña</h2>

    <form id="recover-form" class="mt-4">

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" id="recover-email">
            <div class="invalid-feedback">Email no válido</div>
        </div>

        <button type="submit" class="btn btn-primary">
            Recuperar contraseña
        </button>

    </form>
</div>

<script src="js/recover.js"></script>
</body>
</html>
